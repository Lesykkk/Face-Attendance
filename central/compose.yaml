services:
  db:
    image: pgvector/pgvector:pg17-trixie
    restart: always
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


  server:
    build:
      context: ./server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - ./server/src:/server/src


  admin:
    build:
      context: ./admin
      target: dev #!!!
    restart: always
    depends_on:
      - server
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: true
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_WS_URL: ${VITE_WS_URL:-/ws}
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/admin
      - /admin/node_modules

volumes:
  postgres_data: